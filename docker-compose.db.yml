# =============================================================================
# Stack 1/3 — Database (PostgreSQL + Prisma migrations)
# -----------------------------------------------------------------------------
# Deploy this FIRST. It provides the Postgres server the backend connects to and
# a one-shot job that applies Prisma migrations (and optionally seeds).
#
# Local:   docker compose -f docker-compose.db.yml --env-file .env.db up -d
# Dokploy: create a "Compose" service pointing at this file.
# =============================================================================

name: docspyre-db

services:
  postgres:
    image: postgres:16-bookworm
    container_name: docspyre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docspyre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-docspyre_app}
    volumes:
      - docspyre-pgdata:/var/lib/postgresql/data
    # Keep Postgres OFF the public internet. Uncomment only for trusted admin
    # access, and prefer an SSH tunnel instead.
    # ports:
    #   - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docspyre} -d ${POSTGRES_DB:-docspyre_app}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dokploy-network

  # One-shot: apply migrations, then exit. Re-runs on every `up`; it is a no-op
  # when the schema is already current.
  migrate:
    build:
      context: ./docspyre/docspyre-database
      dockerfile: Dockerfile
    image: docspyre-database:latest
    container_name: docspyre-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@docspyre.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    # Migrate only (default). To seed on first deploy, switch to:
    # command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    command: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - dokploy-network

volumes:
  docspyre-pgdata:

networks:
  dokploy-network:
    external: true
