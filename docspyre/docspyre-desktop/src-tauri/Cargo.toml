[package]
name = "docspyre-desktop"
version = "1.0.0"
description = "DocSpyre Desktop"
authors = ["DocSpyre"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "docspyre_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
tauri-plugin-updater = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
